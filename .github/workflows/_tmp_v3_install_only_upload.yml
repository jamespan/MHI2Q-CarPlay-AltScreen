name: Temporary V3 install-only binary upload

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  promote-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify V3 mirror binary
        shell: bash
        run: |
          set -euo pipefail
          src="https://raw.githubusercontent.com/Lanye-z/kaiyuan1/5ef3bd778c22883047c15d87a964f1d291caa789/Toolbox/carplay_alt_screen/mirror_display/release/carplay-alt111-mirror-display"
          dst="Toolbox/carplay_alt_screen/mirror_display/release/carplay-alt111-mirror-display"
          curl -L --fail --retry 3 --retry-delay 2 "$src" -o /tmp/carplay-alt111-mirror-display
          echo "aa5639110d94afd083d069787517885e192237d6fa008244a56812f42f9f8d93  /tmp/carplay-alt111-mirror-display" | sha256sum -c -
          install -m 0755 /tmp/carplay-alt111-mirror-display "$dst"

      - name: Commit binary and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp_v3_install_only_upload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Toolbox/carplay_alt_screen/mirror_display/release/carplay-alt111-mirror-display .github/workflows/_tmp_v3_install_only_upload.yml
          git commit -m "build: promote V3 install-only mirror binary"
          git push origin HEAD:main
